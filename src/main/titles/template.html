            const overhang = Math.max(0, ink.actualBoundingBoxLeft, ink.actualBoundingBoxRight - ink.width) * 1.04;
            const effect = (style === 'shadow' ? cap * 0.5 : style === 'stroke' ? cap * 0.04 : 0) + (cue.enter === 'roll' ? 5 : 0);
            const pad = overhang + effect + (caption ? cap * (caption.animation === 'pulse' ? Math.max(.3, b.width * .09 / cap) : caption.background !== 'none' ? .5 : caption.outline ? .14 : .12) : outlined ? cap * .14 : 0);
            boxes.push({ left: b.left - pad, right: b.right + pad, top: b.top - pad, bottom: b.bottom + pad });
          }
        }
        return { id: cue.id, left: Math.min(...boxes.map(b => b.left)), right: Math.max(...boxes.map(b => b.right)),
          top: Math.min(...boxes.map(b => b.top)), bottom: Math.max(...boxes.map(b => b.bottom)) };
      });
    },
    async seek(timeS, token) {
      if (!Number.isFinite(timeS) || timeS < 0) throw new Error('Invalid title timeline time');
      if (token !== undefined && !(Number.isInteger(token) && token >= 0 && token < 2 ** TOKEN_BITS)) throw new Error('Invalid capture token');
      const seekTicket = ++seekGeneration;
      const ticket = generation;
      const mask = mattes.length ? await seekMatte(timeS) : null;
      if (ticket !== generation || seekTicket !== seekGeneration) return;
      let appearing = false;
      for (const overlay of overlays) {
        const { item, img, aspect, width, height } = overlay;
        const box = overlayLayout(item, timeS, width, height, aspect);
        Object.assign(img.style, { left: `${box.left}px`, top: `${box.top}px`, width: `${box.width}px`, height: `${box.height}px`,
          borderRadius: `${box.radius}px`, visibility: box.opacity > 0 ? 'visible' : 'hidden', opacity: String(box.opacity),
          transform: `translateY(${box.dy}px) rotate(${box.rotate}deg) scale(${box.scale})` });
        if (box.opacity > 0 && !overlay.shown) appearing = true;
        overlay.shown = box.opacity > 0;
      }
      // VO7: one extra paint when an image first shows, so its layer is in the frame the capture reads.
      if (appearing) {
        await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(() => resolve())));
        if (ticket !== generation || seekTicket !== seekGeneration) return;
      }
      const drawing = graphics.map(gfx => drawGraphic(gfx, timeS, mask, token !== undefined));
      for (const animation of animations) {
        animation.pause();
        animation.currentTime = timeS * 1000;
      }
      await Promise.all(drawing);
      if (ticket !== generation || seekTicket !== seekGeneration) return;
      const openingRows = new Map(openingGroups.flatMap(group => openingFrame(group, timeS).map(row => [row.line, row])));
      for (const { cue, root, maskRoot, words, caption, draw, opening, cap, outlined } of cues) {
        if (opening) {
          // An opening style: placed, popped and dimmed from the pure layout, the same frame live and in export.
          const row = draw ? openingRows.get(opening) : null;
          root.style.visibility = row ? 'visible' : 'hidden';
          // Words inherit, so the whole phrase goes together at the handover (a visible child would outlive a hidden root).
          for (const word of words) word.element.style.visibility = 'inherit';
          if (!row) continue;
          Object.assign(root.style, { left: `${row.cx}px`, top: `${row.cy - opening.inkTop - opening.h / 2}px`,
            transform: `translate(-50%, 0) scale(${row.scale.toFixed(4)})`, opacity: row.opacity.toFixed(3) });
          // The same solid black edge as the Outline option, only where main measured the footage too bright or busy.
          if (!outlined) Object.assign(root.style, row.edge ? { webkitTextStroke: `${(cap * .2).toFixed(2)}px #000`, paintOrder: 'stroke fill', strokeLinejoin: 'round' } : { webkitTextStroke: '', paintOrder: '' });
          for (const word of words) {
            word.element.style.color = word.accent && cue.accent ? cue.accent : cue.color;
            word.element.style.opacity = (1 - row.dim * (1 - (word.accent ? opening.recipe.dim.accent : opening.recipe.dim.primary))).toFixed(3);
          }
          continue;
        }
        const active = draw && timeS >= cue.s && timeS < cue.e;
        root.style.visibility = active && (!maskRoot || mask) ? 'visible' : 'hidden';
        if (maskRoot) { maskRoot.style.maskImage = mask ? `url("${mask}")` : 'none'; maskRoot.style.webkitMaskImage = maskRoot.style.maskImage; }
        // Word e is the end of speech, not the end of its displayed lifetime.
        for (const [index, word] of words.entries()) {
          const reveal = !caption || caption.animation === 'typewriter';
          word.element.style.visibility = active && (!reveal || timeS >= word.s) ? 'visible' : 'hidden';
          const speaking = timeS >= word.s && timeS < word.e;
          if (!caption) {
            if (cue.id.startsWith('kinetic-')) word.element.style.color = speaking || word.accent ? cue.accent || cue.color : cue.color;
            continue;
          }
          word.element.style.color = speaking || word.accent ? caption.accent : caption.primary;
          if (caption.animation === 'box-highlight') {
            word.element.style.background = speaking ? caption.accent : 'transparent';
            if (speaking) word.element.style.color = '#101014';
          }
          {
            const progress = Math.max(0, Math.min(1, (timeS - word.s) / Math.max(.01, word.e - word.s)));
            const scale = word.accent && speaking ? 1 + .18 * Math.sin(progress * Math.PI) : 1;
            // Push the line's other words out by half the popped growth each side; transform only, so no reflow.
            const popping = words.find(other => other.accent && timeS >= other.s && timeS < other.e && other.element.offsetTop === word.element.offsetTop);
            let shift = 0;
            if (popping && popping !== word) {
              const p = Math.max(0, Math.min(1, (timeS - popping.s) / Math.max(.01, popping.e - popping.s)));
              const grow = popping.element.offsetWidth * .18 * Math.sin(p * Math.PI) / 2;
              shift = words.indexOf(popping) < index ? grow : -grow;
            }
            word.element.style.transform = shift ? `translateX(${shift.toFixed(2)}px) scale(${scale})` : `scale(${scale})`;
          }
          if (caption.animation === 'typewriter' && caption.preset !== 'punch') {
            const progress = Math.max(0, Math.min(1, (timeS - word.s) / Math.max(.01, word.e - word.s)));
            const visible = Math.ceil(progress * word.text.length) / word.text.length;
            word.element.style.clipPath = `inset(0 ${(1 - visible) * 100}% 0 0)`;
          }
        }
      }
      if (token !== undefined) markCapture(token);
      // Flush the style change, then cross a paint boundary before capturePage.
      // RAF is only a compositor fence; timeline time never comes from its clock. It is not a guarantee that the
      // frame is drawn (CAP2: under export load a capture after it read the previous seek), so export checks the token.
      void stage.offsetHeight;
      // CAP3: a capture seek answers how many graphics show: their frames are checked again by main (capture-frame.ts).
      const shown = token === undefined ? undefined : graphics.filter(gfx => gfx.wrap.style.visibility === 'visible').length;
      return new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(() => resolve(shown))));
    }
  };
</script>
</body>
